name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSIC_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/music.keystore"

      - name: Build signed release
        env:
          MUSIC_KEYSTORE: ${{ runner.temp }}/music.keystore
          MUSIC_KEYSTORE_PASSWORD: ${{ secrets.MUSIC_KEYSTORE_PASSWORD }}
          MUSIC_KEY_ALIAS: ${{ secrets.MUSIC_KEY_ALIAS }}
          MUSIC_KEY_PASSWORD: ${{ secrets.MUSIC_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PversionNameOverride="${GITHUB_REF_NAME#v}" \
            -PversionCodeOverride="$((GITHUB_RUN_NUMBER + 1))"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "Music-${GITHUB_REF_NAME#v}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Music-*.apk
          generate_release_notes: true
